<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SHINME APP | 新芽 · 새싹</title>

  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <main class="app-shell">

    <!-- IMAGE HERO -->
    <section class="image-hero">

      <header class="app-brand">
        <h1>SHINME</h1>

        <div class="brand-languages">
          <span>新芽</span>
          <span>·</span>
          <span>새싹</span>
        </div>
      </header>

      <div class="image-grid">

        <button class="image-card" type="button">
          <img src="./assets/images/image-01.jpg" alt="">
        </button>

        <button class="image-card" type="button">
          <img src="./assets/images/image-02.jpg" alt="">
        </button>

        <button class="image-card" type="button">
          <img src="./assets/images/image-03.jpg" alt="">
        </button>

        <button class="image-card" type="button">
          <img src="./assets/images/image-04.jpg" alt="">
        </button>

        <button class="image-card" type="button">
          <img src="./assets/images/image-05.jpg" alt="">
        </button>

        <button class="image-card" type="button">
          <img src="./assets/images/image-06.jpg" alt="">
        </button>

        <button class="image-card" type="button">
          <img src="./assets/images/image-07.jpg" alt="">
        </button>

        <button class="image-card" type="button">
          <img src="./assets/images/image-08.jpg" alt="">
        </button>

      </div>

    </section>


    <!-- VIDEO ROW 01 -->
    <section class="video-row">

      <article class="video-card">
        <video
          src="./assets/videos/video-01.mp4"
          controls
          playsinline
          preload="metadata"
        ></video>
      </article>

      <article class="video-card">
        <video
          src="./assets/videos/video-02.mp4"
          controls
          playsinline
          preload="metadata"
        ></video>
      </article>

    </section>


    <!-- VIDEO ROW 02 -->
    <section class="video-row">

      <article class="video-card">
        <video
          src="./assets/videos/video-03.mp4"
          controls
          playsinline
          preload="metadata"
        ></video>
      </article>

      <article class="video-card">
        <video
          src="./assets/videos/video-04.mp4"
          controls
          playsinline
          preload="metadata"
        ></video>
      </article>

    </section>


    <!-- COMING SOON -->
    <section class="coming-soon">
      <p class="jp">
        もっと多くのコンテンツを近日公開予定です。
      </p>

      <p class="kr">
        더 많은 콘텐츠가 곧 추가됩니다.
      </p>
    </section>

  </main>

  <script src="./main.js"></script>

</body>
</html>
